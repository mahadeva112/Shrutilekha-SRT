<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Srutilekha</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="notice.css">
</head>
<body class="notice-window">
<div class="sheet" id="sheet">
  <header class="titlebar pywebview-drag-region">
    <div class="brand"><span class="mark" title="Srutilekha"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="bubble" d="M6.5 4.5h11A3.5 3.5 0 0 1 21 8v5.5a3.5 3.5 0 0 1-3.5 3.5h-5L7 20.3V17h-.5A3.5 3.5 0 0 1 3 13.5V8a3.5 3.5 0 0 1 3.5-3.5Z"/><path class="lines" d="M7.5 9.3h9M9.5 12.7h5"/></svg></span><span class="name">Srutilekha</span></div>
    <div class="chrome">
      <button class="icon-btn close" id="close" title="Close" data-icon="x"></button>
    </div>
  </header>

  <main class="notice-body">
    <div class="notice-head">
      <span class="notice-glyph" id="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="warn"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5m0 3.4v.1"/></svg>
        <svg viewBox="0 0 24 24" class="info"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16.2 9.5"/></svg>
      </span>
      <div class="notice-titles">
        <span class="kicker" id="kicker">ONE MORE STEP</span>
        <h2 id="title"></h2>
      </div>
    </div>
    <p class="notice-message" id="message"></p>

    <div class="done-steps" id="steps" hidden>
      <span class="kicker">What to do</span>
      <ol id="stepList"></ol>
    </div>

    <details class="done-details" id="details" hidden>
      <summary>Show details</summary>
      <pre id="detailsText"></pre>
    </details>
  </main>

  <footer class="notice-foot">
    <button class="btn ghost" id="copy" type="button" hidden>Copy details</button>
    <span class="grow"></span>
    <button class="btn primary" id="ok" type="button">Got it</button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script src="notice.js"></script>
</body>
</html>
