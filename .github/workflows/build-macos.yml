name: Build macOS app
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - '**.lua'
      - 'Srutilekha.spec'
      - 'requirements*.txt'
      - 'scripts/build_ffmpeg_macos.sh'
      - 'docs/macos-install.txt'
      - '.github/workflows/build-macos.yml'
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Restore LGPL FFmpeg build
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            build/vendor/ffmpeg
            build/vendor/ffmpeg-7.1.1.tar.xz
            build/vendor/ffmpeg-macos-*
          key: ffmpeg-7.1.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_macos.sh') }}
      - name: Build LGPL FFmpeg and preserve corresponding source
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg_macos.sh
      - name: Build app and disk image
        run: python scripts/build_release.py
      - name: Verify packaged runtime without external Python
        run: |
          report="$RUNNER_TEMP/srutilekha-smoke.json"
          if ! env -i HOME="$HOME" PATH=/usr/bin:/bin USER="$USER" \
               dist/Srutilekha.app/Contents/MacOS/Srutilekha --self-test "$report"; then
            [ -f "$report" ] && cat "$report"
            echo 'Packaged runtime smoke test failed'; exit 1
          fi
          cat "$report"
      - name: Verify disk image
        run: |
          dmg=$(ls dist/release/*.dmg)
          hdiutil verify "$dmg"
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          test -x "$mount/Srutilekha.app/Contents/MacOS/Srutilekha"
          test -x "$mount/Srutilekha.app/Contents/MacOS/Srutilekha-worker"
          test -L "$mount/Applications"
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@v4
        with:
          name: Srutilekha-macos
          path: dist/release/*
