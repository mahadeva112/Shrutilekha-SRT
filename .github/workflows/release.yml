name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify tag and version
        shell: python
        run: |
          import json, os
          version = json.load(open('version.json'))['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and version.json differ'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            nasm
            curl
            tar
            xz
      - name: Build LGPL FFmpeg and preserve corresponding source
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build app and installer
        run: python scripts/build_release.py
      - name: Verify packaged runtime without external Python
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $report = Join-Path $env:RUNNER_TEMP 'srutilekha-smoke.json'
          $process = Start-Process -FilePath 'dist/Srutilekha/Srutilekha.exe' -ArgumentList @('--self-test', $report) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged runtime smoke test failed' }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: Srutilekha-windows
          path: dist/release/*
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem 'dist/release' -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --title "Srutilekha $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
