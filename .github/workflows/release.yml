name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify tag and version
        shell: python
        run: |
          import json, os
          version = json.load(open('version.json'))['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and version.json differ'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            nasm
            curl
            tar
            xz
      - name: Build LGPL FFmpeg and preserve corresponding source
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build app and installer
        run: python scripts/build_release.py
      - name: Verify packaged runtime without external Python
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $report = Join-Path $env:RUNNER_TEMP 'srutilekha-smoke.json'
          $process = Start-Process -FilePath 'dist/Srutilekha/Srutilekha.exe' -ArgumentList @('--self-test', $report) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) {
            if (Test-Path $report) { Get-Content $report }
            throw 'Packaged runtime smoke test failed'
          }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: Srutilekha-windows
          path: dist/release/*
  macos:
    uses: ./.github/workflows/build-macos.yml
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge assets and checksums
        shell: python
        run: |
          import hashlib, pathlib, shutil
          out = pathlib.Path('release'); out.mkdir()
          for folder in ('Srutilekha-windows', 'Srutilekha-macos'):
              for f in sorted(pathlib.Path('artifacts', folder).iterdir()):
                  if f.name == 'SHA256SUMS.txt':
                      continue
                  target = out / f.name
                  if target.exists():
                      # Shared files (FFmpeg source, licence) must be identical.
                      assert target.read_bytes() == f.read_bytes(), 'Conflicting asset ' + f.name
                  else:
                      shutil.copy2(f, target)
          sums = [hashlib.sha256(f.read_bytes()).hexdigest() + '  ' + f.name for f in sorted(out.iterdir())]
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(sums))
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists; validated builds remain available as workflow artifacts."
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
              --title "Srutilekha $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
